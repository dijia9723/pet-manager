basePath: /api/v1
definitions:
  auth.ChangePasswordInput:
    properties:
      new_password:
        maxLength: 64
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  auth.LoginInput:
    properties:
      password:
        description: 明文口令（校验时比对散列）
        type: string
      tenant_code:
        description: 租户编码；为空表示平台管理员登录
        type: string
      username:
        description: 登录名
        type: string
    required:
    - password
    - username
    type: object
  auth.RefreshInput:
    properties:
      refresh_token:
        description: 登录时下发的刷新令牌
        type: string
    required:
    - refresh_token
    type: object
  auth.UpdateProfileInput:
    properties:
      nickname:
        maxLength: 64
        type: string
    required:
    - nickname
    type: object
  config.Input:
    properties:
      config_key:
        description: 参数键
        maxLength: 128
        type: string
      group_key:
        description: 分组键
        maxLength: 64
        type: string
      name:
        description: 参数名称
        maxLength: 64
        type: string
      remark:
        description: 备注
        maxLength: 255
        type: string
      status:
        description: 状态，非 disabled 一律按 enabled
        type: string
      type:
        description: 值类型
        enum:
        - string
        - number
        - bool
        - json
        type: string
      value:
        description: 参数值
        type: string
    required:
    - config_key
    - name
    - type
    type: object
  dict.DictInput:
    properties:
      code:
        description: 字典编码
        maxLength: 64
        type: string
      name:
        description: 字典名称
        maxLength: 64
        type: string
      remark:
        description: 备注
        maxLength: 255
        type: string
      status:
        description: 状态，非 disabled 一律按 enabled
        type: string
    required:
    - code
    - name
    type: object
  dict.DictItemInput:
    properties:
      label:
        description: 显示文本
        maxLength: 64
        type: string
      remark:
        description: 备注
        maxLength: 255
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态，非 disabled 一律按 enabled
        type: string
      storage_bytes:
        description: 存储套餐容量（字节，最大 1PiB）
        maximum: 1125899906842624
        minimum: 0
        type: integer
      value:
        description: 取值
        maxLength: 128
        type: string
    required:
    - label
    - value
    type: object
  hosting.CommandInput:
    properties:
      command:
        maxLength: 16384
        type: string
    required:
    - command
    type: object
  hosting.DeployInput:
    properties:
      admin_email:
        maxLength: 255
        type: string
      admin_password:
        maxLength: 128
        minLength: 12
        type: string
      license_key:
        maxLength: 2048
        type: string
      port:
        maximum: 65535
        minimum: 1024
        type: integer
    required:
    - admin_email
    - admin_password
    - port
    type: object
  hosting.FileAction:
    properties:
      destination:
        maxLength: 1024
        type: string
      operation:
        enum:
        - mkdir
        - rename
        - delete
        type: string
      path:
        maxLength: 1024
        type: string
    required:
    - operation
    - path
    type: object
  hosting.ServerInput:
    properties:
      auth_type:
        enum:
        - key
        - password
        type: string
      credential:
        maxLength: 65536
        type: string
      host:
        maxLength: 255
        type: string
      host_fingerprint:
        maxLength: 1024
        type: string
      name:
        maxLength: 128
        type: string
      port:
        maximum: 65535
        minimum: 1
        type: integer
      remark:
        maxLength: 255
        type: string
      status:
        enum:
        - enabled
        - disabled
        type: string
      username:
        maxLength: 64
        type: string
    required:
    - auth_type
    - host
    - host_fingerprint
    - name
    - port
    - status
    - username
    type: object
  hosting.TextInput:
    properties:
      content:
        type: string
      path:
        maxLength: 1024
        type: string
    required:
    - path
    type: object
  hosting.WebsiteInput:
    properties:
      cms:
        enum:
        - none
        - directus
        type: string
      cms_url:
        maxLength: 512
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      server_id:
        type: integer
      status:
        enum:
        - enabled
        - disabled
        type: string
      tenant_id:
        type: integer
      url:
        maxLength: 512
        type: string
    required:
    - cms
    - name
    - server_id
    - status
    - tenant_id
    type: object
  job.CreateInput:
    properties:
      code:
        maxLength: 64
        type: string
      config:
        $ref: '#/definitions/job.ExecutionConfig'
      kind:
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      spec:
        maxLength: 64
        type: string
      status:
        type: string
      timeout_seconds:
        type: integer
    required:
    - code
    - kind
    - name
    - spec
    type: object
  job.ExecutionConfig:
    properties:
      args:
        items:
          type: string
        type: array
      body:
        type: string
      curl:
        type: string
      handler:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      script:
        type: string
      script_path:
        type: string
      url:
        type: string
      work_dir:
        type: string
    type: object
  job.Item:
    properties:
      builtin:
        type: boolean
      code:
        type: string
      config:
        $ref: '#/definitions/job.ExecutionConfig'
      created_at:
        type: string
      id:
        type: integer
      kind:
        type: string
      last_message:
        type: string
      last_run_at:
        type: string
      last_status:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      remark:
        type: string
      spec:
        type: string
      status:
        type: string
      timeout_seconds:
        type: integer
    type: object
  job.Method:
    properties:
      code:
        type: string
      name:
        type: string
      remark:
        type: string
    type: object
  job.MethodCatalog:
    properties:
      methods:
        items:
          $ref: '#/definitions/job.Method'
        type: array
      shell_available:
        type: boolean
    type: object
  job.UpdateInput:
    properties:
      config:
        $ref: '#/definitions/job.ExecutionConfig'
      kind:
        type: string
      name:
        maxLength: 128
        type: string
      remark:
        maxLength: 255
        type: string
      spec:
        maxLength: 64
        type: string
      timeout_seconds:
        type: integer
    required:
    - spec
    type: object
  notification.Input:
    properties:
      attachment_ids:
        description: 引用本存储空间的就绪资源
        items:
          type: integer
        maxItems: 10
        type: array
      category:
        enum:
        - announcement
        - maintenance
        - business
        type: string
      content:
        maxLength: 20000
        type: string
      priority:
        enum:
        - normal
        - urgent
        type: string
      require_process:
        description: 是否需要接收人提交处理结果
        type: boolean
      target_ids:
        items:
          type: integer
        maxItems: 500
        type: array
      target_type:
        enum:
        - all_tenants
        - tenants
        - tenant_users
        - platform_users
        - own_tenant
        type: string
      title:
        maxLength: 128
        type: string
    required:
    - category
    - content
    - priority
    - target_type
    - title
    type: object
  notification.ProcessInput:
    properties:
      feedback:
        maxLength: 2000
        type: string
    required:
    - feedback
    type: object
  permission.Input:
    properties:
      code:
        description: 权限点编码
        maxLength: 128
        type: string
      icon:
        description: 图标名
        maxLength: 64
        type: string
      name:
        description: 显示名称
        maxLength: 64
        type: string
      parent_id:
        description: 父节点 ID，0 为根
        type: integer
      path:
        description: 菜单路由
        maxLength: 128
        type: string
      scope:
        description: platform / tenant
        enum:
        - platform
        - tenant
        type: string
      sort:
        description: 排序
        type: integer
      type:
        description: menu / button
        enum:
        - menu
        - button
        type: string
    required:
    - code
    - name
    - scope
    - type
    type: object
  rbac.RoleInput:
    properties:
      code:
        description: 角色编码
        maxLength: 64
        type: string
      name:
        description: 角色名称
        maxLength: 64
        type: string
      permission_ids:
        description: 授权的权限点 ID 集合
        items:
          type: integer
        type: array
      remark:
        description: 备注
        maxLength: 255
        type: string
    required:
    - code
    - name
    type: object
  response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  storage.AllocationInput:
    properties:
      action:
        enum:
        - assign
        - expand
        type: string
      add_bytes:
        description: expand 时的追加字节数
        type: integer
      plan_id:
        description: assign 时的目标套餐
        type: integer
      remark:
        maxLength: 255
        type: string
    required:
    - action
    type: object
  tenant.CreateInput:
    properties:
      code:
        description: 租户编码
        maxLength: 64
        type: string
      contact_name:
        description: 联系人
        maxLength: 64
        type: string
      contact_phone:
        description: 联系电话
        maxLength: 32
        type: string
      expire_at:
        description: 到期时间
        type: string
      name:
        description: 租户名称
        maxLength: 128
        type: string
      owner:
        allOf:
        - $ref: '#/definitions/tenant.OwnerInput'
        description: 随租户创建的主账号
    required:
    - code
    - name
    - owner
    type: object
  tenant.DestroyInput:
    properties:
      confirm_code:
        description: 必须精确匹配的租户编码
        maxLength: 64
        type: string
    required:
    - confirm_code
    type: object
  tenant.OwnerInput:
    properties:
      nickname:
        description: 主账号昵称
        maxLength: 64
        type: string
      password:
        description: 主账号口令
        maxLength: 64
        minLength: 6
        type: string
      username:
        description: 主账号登录名
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  tenant.UpdateInput:
    properties:
      code:
        description: 租户编码
        maxLength: 64
        type: string
      contact_name:
        description: 联系人
        maxLength: 64
        type: string
      contact_phone:
        description: 联系电话
        maxLength: 32
        type: string
      name:
        description: 租户名称
        maxLength: 128
        type: string
    required:
    - code
    - name
    type: object
  tenantprofile.UpdateInput:
    properties:
      address:
        maxLength: 255
        type: string
      contact_name:
        maxLength: 64
        type: string
      contact_phone:
        maxLength: 32
        type: string
      name:
        maxLength: 128
        type: string
    required:
    - name
    type: object
  tenantuser.CreateInput:
    properties:
      nickname:
        description: 昵称
        maxLength: 64
        type: string
      password:
        description: 初始口令
        maxLength: 64
        minLength: 6
        type: string
      role_ids:
        description: 角色绑定
        items:
          type: integer
        type: array
      username:
        description: 登录名
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  tenantuser.ResetPasswordInput:
    properties:
      password:
        description: 新口令
        maxLength: 64
        minLength: 6
        type: string
    required:
    - password
    type: object
  tenantuser.UpdateInput:
    properties:
      nickname:
        description: 昵称
        maxLength: 64
        type: string
      role_ids:
        description: 角色绑定
        items:
          type: integer
        type: array
      status:
        description: 状态
        enum:
        - enabled
        - disabled
        type: string
    type: object
host: localhost:8088
info:
  contact:
    name: pet-manager
  description: 宠物商户 SaaS 多租户底座脚手架接口文档。全站统一响应体 {"code","message","data"}，code=0 表示成功，业务错误码见
    pkg/errcode。
  license:
    name: 私有项目，未授权请勿使用
  title: 宠物商户 SaaS 后端 API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 校验原密码后写入新密码，成功后该账号全部会话立即失效，需用新密码重新登录
      parameters:
      - description: 改密参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 原密码不正确 / 新密码不合规
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 携带 tenant_code 时按租户子账号登录，不携带时按平台管理员登录；成功返回双令牌与身份信息
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: data 为 LoginResult
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 用户名或密码错误 / 账号停用
          schema:
            $ref: '#/definitions/response.Body'
      summary: 统一登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 注销当前 access_token 对应的会话，令牌立即失效（可强制下线）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - 认证
  /auth/menus:
    get:
      description: 按账号权限点返回侧边栏菜单树，key 即权限点编码
      produces:
      - application/json
      responses:
        "200":
          description: data 为 []MenuNode
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 我的菜单
      tags:
      - 认证
  /auth/profile:
    get:
      description: 返回当前登录账号的身份、角色编码与权限点集合，不区分平台/租户身份
      produces:
      - application/json
      responses:
        "200":
          description: data 为 UserInfo
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 当前账号信息
      tags:
      - 认证
    put:
      consumes:
      - application/json
      description: 修改当前登录账号的昵称（平台/租户账号通用），返回最新 UserInfo
      parameters:
      - description: 个人资料
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: data 为 UserInfo
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: 参数不合法
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 修改个人资料
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 用 refresh_token 换取新的双令牌，旧会话保持有效
      parameters:
      - description: 刷新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: data 为 LoginResult
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: 刷新凭证无效或已过期
          schema:
            $ref: '#/definitions/response.Body'
      summary: 刷新令牌
      tags:
      - 认证
  /platform/audit-logs:
    get:
      description: 只读查询登录后的写操作审计记录（POST/PUT/PATCH/DELETE），支持租户/操作人/时间范围筛选
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: page_size
        type: integer
      - description: 按租户筛选，0/不传为全部
        in: query
        name: tenant_id
        type: integer
      - description: 按操作人筛选
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 response.Page[Item]
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 审计日志列表
      tags:
      - 平台-审计日志
  /platform/configs:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: page_size
        type: integer
      - description: 键名/名称关键字
        in: query
        name: keyword
        type: string
      - description: 按分组筛选
        in: query
        name: group_key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 response.Page[Item]
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 参数列表
      tags:
      - 平台-参数配置
    post:
      consumes:
      - application/json
      parameters:
      - description: 参数内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/config.Input'
      produces:
      - application/json
      responses:
        "200":
          description: data 为 Item
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: 参数键已存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 新建参数
      tags:
      - 平台-参数配置
  /platform/configs/{id}:
    delete:
      parameters:
      - description: 参数 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 删除参数
      tags:
      - 平台-参数配置
    put:
      consumes:
      - application/json
      parameters:
      - description: 参数 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 参数内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/config.Input'
      produces:
      - application/json
      responses:
        "200":
          description: data 为 Item
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 编辑参数
      tags:
      - 平台-参数配置
  /platform/dicts:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 200
        in: query
        name: page_size
        type: integer
      - description: 编码/名称关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为 response.Page[Item]
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 字典类型列表
      tags:
      - 平台-字典管理
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典类型
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dict.DictInput'
      produces:
      - application/json
      responses:
        "200":
          description: data 为 Item
          schema:
            $ref: '#/definitions/response.Body'
        "409":
          description: 字典编码已存在
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - BearerAuth: []
      summary: 新建字典类型
      tags:
      - 平台-字典管理
  /platform/dicts/{id}:
    delete:
      description: 软删字典类型，其下字典项一并软删
      parameters:
      - description: 字典 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
