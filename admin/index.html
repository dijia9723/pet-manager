<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <script>
      /* 首屏防闪：React 挂载前按持久化偏好提前切暗色 class */
      try {
        var __pref = JSON.parse(
          localStorage.getItem('%VITE_APP_NAMESPACE%:preferences') || 'null',
        );
        if (__pref && __pref.state && __pref.state.themeMode === 'dark') {
          document.documentElement.classList.add('app-dark');
        }
      } catch (e) {}
    </script>
    <style>
      /* 首屏 loading：应用挂载后移除 #app-loading */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fff;
        z-index: 9999;
      }
      html.app-dark #app-loading {
        background: #000;
      }
      #app-loading .spin {
        width: 36px;
        height: 36px;
        border: 3px solid #e6f4ff;
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: app-loading-rotate 0.8s linear infinite;
      }
      html.app-dark #app-loading .spin {
        border-color: #111d2c;
        border-top-color: #1677ff;
      }
      #app-loading .text {
        color: rgba(0, 0, 0, 0.45);
        font-size: 14px;
      }
      html.app-dark #app-loading .text {
        color: rgba(255, 255, 255, 0.45);
      }
      @keyframes app-loading-rotate {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading">
      <div class="spin"></div>
      <div class="text">正在加载…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
