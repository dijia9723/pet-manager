# 本地开发依赖：PostgreSQL / Redis / MinIO
#
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d
#
# 与 configs/config.yaml 的默认值一一对应：
#   PG  127.0.0.1:5432  postgres/postgres  db=pet_manager
#   Redis 127.0.0.1:6379
#   MinIO 127.0.0.1:9000（控制台 9001）minioadmin/minioadmin
name: pet-manager

services:
  postgres:
    image: postgres:15-alpine
    container_name: pet-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pet_manager
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pet_manager"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pet-manager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 宠物照片、打印模板等文件对象的存储，W2 之后开始使用
  minio:
    image: minio/minio:latest
    container_name: pet-manager-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata: